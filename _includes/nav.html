<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="brand-mark" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="17" cy="17" r="16" fill="none" stroke="#143a41" stroke-width="1.4"/>
        <path d="M17 6 C11 13 8 17 8 21 a9 9 0 0 0 18 0 C26 17 23 13 17 6 Z" fill="none" stroke="#1b6472" stroke-width="1.4"/>
        <path d="M9 20 h16" stroke="#3f7a48" stroke-width="1.2"/>
      </svg>
      <span class="brand-text">
        <strong>WACI Lab</strong>
        <span>Water · Agriculture · Conservation</span>
      </span>
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" id="nav-toggle-btn">Menu</button>

    <nav class="primary-nav" id="primary-nav" aria-label="Primary">
      <ul>
        {% for item in site.nav %}
        <li class="{% if page.url == item.url %}active{% endif %}{% if item.children %} has-children{% endif %}">
          <a class="top-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
          {% if item.children %}
          <ul class="submenu">
            {% for child in item.children %}
            <li><a href="{{ child.url | relative_url }}">{{ child.title }}</a></li>
            {% endfor %}
          </ul>
          {% endif %}
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<script>
  (function () {
    var btn = document.getElementById('nav-toggle-btn');
    var nav = document.getElementById('primary-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
    document.querySelectorAll('.has-children > .top-link').forEach(function (link) {
      link.addEventListener('click', function (e) {
        if (window.innerWidth <= 1200) {
          e.preventDefault();
          link.parentElement.classList.toggle('open');
        }
      });
    });
  })();
</script>
