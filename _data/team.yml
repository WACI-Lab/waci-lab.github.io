# Optional per-person fields (anywhere under current/alumni, and pi below):
#   photo:    /assets/img/team/<file>.jpg  -- drop the file in that folder; falls back to initials if unset
#   email:    person's email address -- rendered as a mailto: link
#   linkedin: full LinkedIn profile URL
#   scholar:  full Google Scholar profile URL
#   website:  personal / lab-page URL
# All are optional -- commented-out lines below are placeholders; fill in a
# value and uncomment to make the link appear. Leave commented/unset and the
# card just shows initials with no link row (or fewer links).
#
# When someone leaves the lab, cut their entry from the matching `current.*`
# list and paste it into the same-named `alumni.*` list.

pi:
  name: Dr. Bin Peng
  role: Assistant Professor
  bio: >-
    Dr. Peng leads the WACI Lab and studies how water, nutrient, and carbon
    cycles connect agricultural productivity to environmental sustainability,
    combining field and lab measurement, computational modeling, remote
    sensing, and AI.
  photo: /assets/img/team/bin-peng.jpg
  links:
    website: "https://pengbinpeluo.github.io/"
    scholar: "https://scholar.google.com.hk/citations?user=tkya-dMAAAAJ&hl=en"
    orcid: "https://orcid.org/0000-0002-7284-3010"
    github: "https://github.com/pengbinpeluo"

